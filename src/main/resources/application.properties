
# ---------- Server ----------
server.port=${PORT:8080}

# ---------- MySQL Database ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/expense_manager_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:9906}

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- JWT ----------
app.jwt.secret=${JWT_SECRET:ExpenseManagerSuperSecretKeyForJwtToken2026}
app.jwt.expiration-ms=86400000

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}